name: build

# 每次推送与 PR 都在 Linux 上编译，并做一轮接口冒烟测试
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  linux:
    name: 编译（Linux / gcc）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 查看编译器版本
        run: gcc --version

      - name: 编译命令行版
        run: |
          gcc -std=c11 -Wall -Wextra -O2 -Isrc main.c src/campus.c -o campus-cli

      - name: 编译 Web 服务
        run: |
          gcc -std=c11 -Wall -Wextra -O2 -Isrc src/server.c src/campus.c -o campus-server

      - name: 命令行版冒烟测试（学生上机 + 下机结账）
        run: |
          mkdir -p smoke && cd smoke
          cp ../campus-cli .
          printf '1\nC001\n123456\n2\n1\n3\n4\n1\n0\n0\n' > in.txt
          ./campus-cli < in.txt > out.txt || true
          echo '--- 关键输出 ---'
          grep -E '登录成功|上机登记成功|下机成功|上机次数' out.txt || true
          echo '--- 上机记录文件 ---'
          cat data/C001.txt
          grep -q '上机登记成功' out.txt
          grep -q '下机成功' out.txt

      - name: Web 服务冒烟测试（健康检查 / 登录 / 充值）
        run: |
          ./campus-server 8090 web data &
          SRV=$!
          sleep 1
          curl -sf http://127.0.0.1:8090/api/health
          echo
          curl -sf -X POST http://127.0.0.1:8090/api/login \
               -H 'Content-Type: application/json' \
               -d '{"id":"C001","pwd":"123456"}'
          echo
          curl -sf -X POST http://127.0.0.1:8090/api/admin/recharge \
               -H 'Content-Type: application/json' \
               -H 'X-Token: ADMIN' -H 'X-Pwd: admin123' \
               -d '{"id":"C003","amount":20}'
          echo
          curl -sf http://127.0.0.1:8090/ -o page.html
          grep -q '模拟校园卡' page.html
          kill $SRV

  windows:
    name: 编译（Windows / MinGW）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译命令行版
        shell: pwsh
        run: |
          gcc -std=c11 -Wall -Wextra -O2 -Isrc main.c src/campus.c -o campus-cli.exe

      - name: 编译 Web 服务（链接 WinSock）
        shell: pwsh
        run: |
          gcc -std=c11 -Wall -Wextra -O2 -Isrc src/server.c src/campus.c -o campus-server.exe -lws2_32
