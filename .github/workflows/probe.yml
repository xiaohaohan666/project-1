name: probe

# 临时诊断：每一步都独立执行（不因前一步失败而中止），
# 通过各步骤的成败定位 Linux 编译失败的具体原因
on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 01 编译器版本
        run: gcc --version | head -1

      - name: 02 整体编译 server.c
        run: gcc -std=c11 -Wall -Wextra -O2 -Isrc src/server.c src/campus.c -o /tmp/srv; echo "退出码=$?"

      - name: 03 仅编译不链接 server.c
        run: gcc -std=c11 -Wall -Wextra -O2 -Isrc -c src/server.c -o /tmp/srv.o; echo "退出码=$?"

      - name: 04 单独编译 campus.c
        run: gcc -std=c11 -Isrc -c src/campus.c -o /tmp/cam.o; echo "退出码=$?"

      - name: 05 检查是否残留 Windows 专有符号
        run: |
          echo "--- _strnicmp 出现次数 ---"
          grep -c "_strnicmp" src/server.c || true
          echo "--- ci_ncmp 定义 ---"
          grep -n "ci_ncmp" src/server.c || true
          echo "--- 平台分支标记 ---"
          grep -n "ifdef _WIN32\|^#else\|^#endif" src/server.c | head -20

      - name: 06 预处理，确认 POSIX 分支被选中
        run: |
          gcc -std=c11 -Isrc -E src/server.c -o /tmp/srv.i
          echo "--- 预处理产物行数 ---"
          wc -l /tmp/srv.i
          echo "--- 是否包含 POSIX 分支特征 ---"
          grep -c "sys/socket.h\|unistd.h" /tmp/srv.i || true
          echo "--- 是否误含 winsock ---"
          grep -ci "winsock" /tmp/srv.i || true

      - name: 07 语法检查（-fsyntax-only）
        run: gcc -std=c11 -Wall -Wextra -Isrc -fsyntax-only src/server.c; echo "退出码=$?"
