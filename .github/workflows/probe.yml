name: probe

# 临时诊断：在 Linux 上编译，把完整报错写入 commit 信息
# （工作流日志需要认证，但 commit 信息可公开读取，便于定位问题）
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译并把报错写入 commit 信息
        run: |
          set +e
          ERR=$(gcc -std=c11 -Wall -Wextra -O2 -Isrc src/server.c src/campus.c -o /tmp/srv 2>&1)
          RC=$?
          echo "退出码=$RC"
          echo "$ERR" | head -40
          git config user.name "probe-bot"
          git config user.email "probe@example.com"
          git commit --allow-empty -m "probe: gcc 退出码 $RC" -m "$ERR"
          git push origin HEAD:refs/heads/probe-report --force
