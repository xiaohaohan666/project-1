name: probe

# 临时诊断：在 Linux 上编译，并把完整报错写入工作流摘要（公开可读）
on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译并抓取报错
        run: |
          set +e
          LOG=$(gcc -std=c11 -Wall -Wextra -O2 -Isrc src/server.c src/campus.c -o /tmp/srv 2>&1)
          RC=$?
          {
            echo "### probe: gcc exit code = $RC"
            echo '```'
            echo "$LOG" | head -c 20000
            echo '```'
            echo "### 关键信息"
            echo '```'
            grep -c . src/server.c
            grep -n "_strnicmp\|ci_ncmp" src/server.c | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "RC=$RC"
