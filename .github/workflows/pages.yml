name: pages

# 把 web/ 目录发布到 GitHub Pages，得到一个**永久固定的 HTTPS 地址**：
#   https://<用户名>.github.io/<仓库名>/
# 手机用流量（外网）也能打开，并且因为满足 HTTPS 安全上下文，
# 可以「添加到主屏幕」当作 App 使用（PWA 安装要求 HTTPS）。
#
# 说明：Pages 只托管静态前端。后端（C 语言服务）需另行部署或通过隧道暴露，
# 首次打开页面后点「设置服务器」填写后端地址即可。
on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查前端资源完整
        run: |
          set -e
          for f in index.html manifest.webmanifest sw.js css/app.css \
                   js/api.js js/ui.js js/app.js js/pwa.js \
                   icons/icon-192.png icons/icon-512.png \
                   icons/maskable-512.png icons/apple-touch-icon.png; do
            test -f "web/$f" || { echo "缺少 web/$f"; exit 1; }
          done
          echo "前端资源齐全"
          # 子路径部署要求路径不能以 / 开头（否则会 404）
          if grep -rn 'src="/\|href="/' web/index.html; then
            echo "发现以 / 开头的绝对路径，子路径部署会 404"; exit 1
          fi
          echo "路径检查通过"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
