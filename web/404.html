<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园一卡通</title>
<!-- GitHub Pages 的 SPA 回退：任何未命中的路径都回到首页，
     使前端路由与「安装到主屏」后的深链都能正常工作 -->
<script>
  location.replace(location.pathname.replace(/[^/]*$/, '') + 'index.html' + location.search);
</script>
</head>
<body>正在打开校园一卡通…</body>
</html>
